[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agentic-ai"
version = "0.1.0"
description = "File-backed, single-resident-model agentic project orchestration for local Ollama"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Local Agentic AI contributors"}]
dependencies = []

[project.scripts]
agentic-ai = "agentic_ai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
